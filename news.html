<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뉴스 - GSLT</title>
  <meta name="description" content="지에스엘티(GSLT)의 새로운 소식과 보도자료를 확인하세요.">
  <link rel="canonical" href="https://home.gslt.kr/news.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GSLT">
  <meta property="og:title" content="뉴스 - GSLT">
  <meta property="og:description" content="지에스엘티(GSLT)의 새로운 소식과 보도자료를 확인하세요.">
  <meta property="og:url" content="https://home.gslt.kr/news.html">
  <meta property="og:image" content="https://home.gslt.kr/img/og-image.png">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" type="image/png" href="img/gslt-symbol.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },
          colors: {
            gslt: { 50: '#effbfc', 100: '#d7f4f7', 200: '#b0e8ee', 300: '#7dd6e0', 400: '#4cc3d2', 500: '#28b8c5', 600: '#1e93a0', 700: '#1c7682' }
          }
        }
      }
    }
  </script>
  <style>
    .break-keep { word-break: keep-all; }
    ::selection { background: #d7f4f7; color: #0f172a; }
    .page-outline {
      -webkit-text-stroke: 2px rgba(40, 184, 197, 0.14);
      color: transparent;
    }
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <header id="site-header"></header>

  <main class="pt-32 md:pt-40 min-h-[60vh]">
    <!-- 타이틀 밴드 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative overflow-hidden mb-12 md:mb-16">
      <span class="page-outline hidden md:block absolute -top-6 right-0 text-[9rem] font-black tracking-tighter leading-none select-none pointer-events-none">NEWS</span>
      <div class="relative">
        <div class="flex items-center gap-4 mb-5">
          <span class="block w-10 h-px bg-gslt-400"></span>
          <span class="text-[11px] uppercase tracking-[0.3em] font-bold text-gslt-600">News</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-black tracking-tight leading-tight break-keep mb-4">GSLT 소식</h1>
        <p class="text-slate-500 text-lg break-keep">지에스엘티의 새로운 소식과 보도자료를 전합니다.</p>
      </div>
    </div>

    <!-- 목록 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="mb-8 flex flex-col sm:flex-row sm:items-center gap-4">
        <input id="news-search" type="search" placeholder="소식 검색"
          class="w-full max-w-sm px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm outline-none focus:border-gslt-400">
        <div id="type-filter" class="flex items-center gap-2 text-sm">
          <button type="button" data-type="all"
            class="px-4 py-2 rounded-full border font-semibold transition-colors border-gslt-400 bg-gslt-50 text-gslt-700">전체</button>
          <button type="button" data-type="article"
            class="px-4 py-2 rounded-full border font-semibold transition-colors border-slate-200 text-slate-500 hover:border-gslt-300">자사 소식</button>
          <button type="button" data-type="press"
            class="px-4 py-2 rounded-full border font-semibold transition-colors border-slate-200 text-slate-500 hover:border-gslt-300">언론보도</button>
        </div>
      </div>
      <div id="featured"></div>
      <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      <div id="empty" class="hidden py-24 text-center text-slate-400">
        <p class="text-lg font-semibold mb-1">등록된 소식이 없습니다</p>
        <p class="text-sm">새로운 소식이 준비되면 이곳에서 알려드리겠습니다.</p>
      </div>
      <div id="more-wrap" class="hidden text-center mt-14">
        <button id="more-btn"
          class="px-8 py-3.5 rounded-full border-2 border-slate-200 text-slate-600 font-bold text-sm hover:border-gslt-400 hover:text-gslt-600 transition-all">
          더 보기
        </button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import {
      renderHeader, renderFooter, fetchPosts, formatDate, escapeHtml,
      isPress, postDateLabel, postHref, postMirrors
    } from './assets/site.js';

    renderHeader('news');
    renderFooter();

    const PAGE = 12;
    let posts = [];
    let shown = 0;

    const grid = document.getElementById('grid');
    const featured = document.getElementById('featured');
    const empty = document.getElementById('empty');
    const moreWrap = document.getElementById('more-wrap');

    function thumb(p, ratioClass) {
      return p.thumbnail
        ? `<img src="${escapeHtml(p.thumbnail)}" alt="${escapeHtml(p.title)}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">`
        : `<div class="w-full h-full bg-gradient-to-br from-gslt-50 to-slate-100 flex items-center justify-center">
             <span class="text-gslt-300 font-black text-2xl tracking-tighter">GSLT</span>
           </div>`;
    }

    // press는 외부 원문으로 나가므로 새 탭 + noopener. 내부 글은 기존 그대로.
    function linkAttrs(p) {
      return isPress(p)
        ? `href="${escapeHtml(postHref(p))}" target="_blank" rel="noopener noreferrer"`
        : `href="${escapeHtml(postHref(p))}"`;
    }

    function outletBadge(p) {
      if (!isPress(p)) return '';
      return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-slate-900 text-white text-[11px] font-bold">${escapeHtml(p.outlet || '언론보도')}</span>`;
    }

    // 전재 매체는 카드 밖에 둔다 — <a> 안에 <a>를 넣으면 HTML이 무효가 된다
    function mirrorLinks(p) {
      const ms = postMirrors(p);
      if (!ms.length) return '';
      return `<div class="flex flex-wrap items-center gap-x-3 gap-y-1 px-6 pb-5 -mt-2">
        <span class="text-[11px] text-slate-400">전재</span>
        ${ms.map(m => `<a href="${escapeHtml(m.url)}" target="_blank" rel="noopener noreferrer"
             class="text-[11px] font-semibold text-slate-500 hover:text-gslt-600 underline underline-offset-2">${escapeHtml(m.label)}</a>`).join('')}
      </div>`;
    }

    function card(p) {
      return `
      <div class="group bg-white rounded-2xl overflow-hidden border border-slate-200/70 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-500">
        <a ${linkAttrs(p)} class="block">
          <div class="aspect-[16/9] overflow-hidden relative">
            ${thumb(p)}
            ${isPress(p) ? `<div class="absolute top-3 left-3">${outletBadge(p)}</div>` : ''}
          </div>
          <div class="p-6">
            <p class="text-xs font-semibold text-slate-400 mb-2">${escapeHtml(postDateLabel(p))}${isPress(p) && p.reporter ? ` · ${escapeHtml(p.reporter)} 기자` : ''}</p>
            <h3 class="font-bold text-lg leading-snug break-keep clamp-2 mb-2 group-hover:text-gslt-600 transition-colors">${escapeHtml(p.title)}${isPress(p) ? ' <span aria-hidden="true" class="text-slate-300 font-normal">↗</span>' : ''}</h3>
            <p class="text-sm text-slate-500 break-keep clamp-2">${escapeHtml(p.excerpt)}</p>
          </div>
        </a>
        ${mirrorLinks(p)}
      </div>`;
    }

    function featuredCard(p) {
      return `
      <div class="group grid grid-cols-1 md:grid-cols-2 bg-white rounded-3xl overflow-hidden border border-slate-200/70 shadow-sm hover:shadow-xl transition-all duration-500 mb-12">
        <a ${linkAttrs(p)} class="aspect-[16/9] md:aspect-auto md:min-h-[320px] overflow-hidden block">${thumb(p)}</a>
        <div class="p-8 md:p-12 flex flex-col justify-center">
          <div class="flex items-center gap-3 mb-4">
            <span class="block w-6 h-px bg-gslt-400"></span>
            <span class="text-[11px] uppercase tracking-[0.25em] font-bold text-gslt-600">${p.pinned ? '고정된 소식' : (isPress(p) ? '언론보도' : 'Latest')}</span>
            ${isPress(p) ? outletBadge(p) : ''}
          </div>
          <p class="text-xs font-semibold text-slate-400 mb-3">${escapeHtml(postDateLabel(p))}${isPress(p) && p.reporter ? ` · ${escapeHtml(p.reporter)} 기자` : ''}</p>
          <a ${linkAttrs(p)} class="block">
            <h2 class="font-black text-2xl md:text-3xl leading-snug break-keep mb-4 group-hover:text-gslt-600 transition-colors">${escapeHtml(p.title)}${isPress(p) ? ' <span aria-hidden="true" class="text-slate-300 font-normal">↗</span>' : ''}</h2>
            <p class="text-slate-500 break-keep clamp-2">${escapeHtml(p.excerpt)}</p>
          </a>
          ${postMirrors(p).length ? `<div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-5">
            <span class="text-[11px] text-slate-400">전재</span>
            ${postMirrors(p).map(m => `<a href="${escapeHtml(m.url)}" target="_blank" rel="noopener noreferrer"
                 class="text-[11px] font-semibold text-slate-500 hover:text-gslt-600 underline underline-offset-2">${escapeHtml(m.label)}</a>`).join('')}
          </div>` : ''}
        </div>
      </div>`;
    }

    let searchQ = '';
    let typeFilter = 'all'; // all | article | press

    function matchesType(p) {
      if (typeFilter === 'press') return isPress(p);
      if (typeFilter === 'article') return !isPress(p);
      return true;
    }

    function matchesSearch(p) {
      if (!searchQ) return true;
      return [p.title, p.excerpt, p.outlet].some(
        v => String(v || '').toLowerCase().includes(searchQ));
    }

    function visiblePosts() {
      return posts.filter(p => matchesType(p) && matchesSearch(p));
    }

    // 검색어도 없고 필터도 '전체'일 때만 대표 카드를 띄운다
    const isDefaultView = () => !searchQ && typeFilter === 'all';

    function currentList() {
      const list = visiblePosts();
      return isDefaultView() ? list.slice(1) : list;
    }

    function renderMore() {
      const rest = currentList();
      const next = rest.slice(shown, shown + PAGE);
      grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
      shown += next.length;
      moreWrap.classList.toggle('hidden', shown >= rest.length);
      if (!visiblePosts().length) {
        grid.innerHTML = `<p class="col-span-full py-16 text-center text-slate-400 text-sm">${searchQ ? '검색 결과가 없습니다.' : '해당하는 소식이 없습니다.'}</p>`;
      }
    }

    function rerender() {
      const def = isDefaultView();
      const list = visiblePosts();
      featured.innerHTML = def && list.length ? featuredCard(list[0]) : '';
      featured.classList.toggle('hidden', !def || !list.length);
      grid.innerHTML = '';
      shown = 0;
      renderMore();
    }

    document.getElementById('news-search').addEventListener('input', e => {
      searchQ = e.target.value.trim().toLowerCase();
      rerender();
    });

    document.getElementById('type-filter').addEventListener('click', e => {
      const btn = e.target.closest('button[data-type]');
      if (!btn) return;
      typeFilter = btn.dataset.type;
      document.querySelectorAll('#type-filter button[data-type]').forEach(b => {
        const on = b.dataset.type === typeFilter;
        b.className = 'px-4 py-2 rounded-full border font-semibold transition-colors ' +
          (on ? 'border-gslt-400 bg-gslt-50 text-gslt-700'
              : 'border-slate-200 text-slate-500 hover:border-gslt-300');
      });
      rerender();
    });

    (async () => {
      let failed = false;
      try {
        posts = await fetchPosts('news');
      } catch (e) {
        posts = [];
        failed = true;
      }
      if (!posts.length) {
        if (failed) empty.innerHTML = '<p class="text-lg font-semibold mb-1">목록을 불러오지 못했습니다</p><p class="text-sm">일시적인 문제일 수 있습니다. 잠시 후 새로고침해 주세요.</p>';
        empty.classList.remove('hidden');
        return;
      }
      rerender();
      document.getElementById('more-btn').addEventListener('click', renderMore);
    })();
  </script>
</body>

</html>
