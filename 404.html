<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 - GSLT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/img/gslt-symbol.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', system-ui, sans-serif;
      background: #0a0a0f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: 7rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      -webkit-text-stroke: 2px rgba(40, 184, 197, 0.5);
      color: transparent;
      line-height: 1;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; }
    p { color: rgba(255, 255, 255, 0.5); margin-bottom: 32px; word-break: keep-all; }
    a {
      display: inline-block;
      background: #28b8c5;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 32px;
      border-radius: 999px;
      transition: background 0.3s;
    }
    a:hover { background: #1e93a0; }
  </style>
</head>

<body>
  <div>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
</body>

</html>
