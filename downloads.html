<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자료실 - GSLT</title>
  <meta name="description" content="지에스엘티(GSLT)의 제품 카탈로그, 제안서 등 자료를 다운로드하세요.">
  <link rel="canonical" href="https://dyiot36524-prog.github.io/gsltHomePage/downloads.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GSLT">
  <meta property="og:title" content="자료실 - GSLT">
  <meta property="og:description" content="지에스엘티(GSLT)의 제품 카탈로그, 제안서 등 자료를 다운로드하세요.">
  <meta property="og:url" content="https://dyiot36524-prog.github.io/gsltHomePage/downloads.html">
  <meta property="og:image" content="https://dyiot36524-prog.github.io/gsltHomePage/img/og-image.png">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" type="image/png" href="img/gslt-symbol.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] },
          colors: {
            gslt: { 50: '#effbfc', 100: '#d7f4f7', 200: '#b0e8ee', 300: '#7dd6e0', 400: '#4cc3d2', 500: '#28b8c5', 600: '#1e93a0', 700: '#1c7682' }
          }
        }
      }
    }
  </script>
  <style>
    .break-keep { word-break: keep-all; }
    ::selection { background: #d7f4f7; color: #0f172a; }
    .page-outline {
      -webkit-text-stroke: 2px rgba(40, 184, 197, 0.14);
      color: transparent;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <header id="site-header"></header>

  <main class="pt-32 md:pt-40 min-h-[60vh]">
    <!-- 타이틀 밴드 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative overflow-hidden mb-12 md:mb-16">
      <span class="page-outline hidden md:block absolute -top-6 right-0 text-[7.5rem] font-black tracking-tighter leading-none select-none pointer-events-none">DOWNLOAD</span>
      <div class="relative">
        <div class="flex items-center gap-4 mb-5">
          <span class="block w-10 h-px bg-gslt-400"></span>
          <span class="text-[11px] uppercase tracking-[0.3em] font-bold text-gslt-600">Downloads</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-black tracking-tight leading-tight break-keep mb-4">자료실</h1>
        <p class="text-slate-500 text-lg break-keep">제품 카탈로그와 소개 자료를 내려받을 수 있습니다.</p>
      </div>
    </div>

    <!-- 목록 -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="list" class="space-y-4"></div>
      <div id="empty" class="hidden py-24 text-center text-slate-400">
        <p class="text-lg font-semibold mb-1">등록된 자료가 없습니다</p>
        <p class="text-sm">자료가 준비되면 이곳에 올라옵니다.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, fetchPosts, formatDate, escapeHtml } from './assets/site.js';

    renderHeader('downloads');
    renderFooter();

    const list = document.getElementById('list');
    const empty = document.getElementById('empty');

    function fileExt(name) {
      const m = String(name || '').match(/\.([a-z0-9]+)$/i);
      return m ? m[1].toUpperCase() : 'FILE';
    }

    function fileSize(bytes) {
      if (!bytes) return '';
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return Math.round(bytes / 1024) + ' KB';
      return bytes + ' B';
    }

    function row(p) {
      // http(s) 또는 상대 경로만 허용 (javascript: 등 위험 스킴 차단)
      const safeUrl = u => /^https?:\/\//i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u);
      const files = (Array.isArray(p.attachments) ? p.attachments : []).filter(f => f && f.url && safeUrl(f.url));
      const fileRows = files.map(f => `
        <a href="${escapeHtml(f.url)}" target="_blank" rel="noopener" download
          class="flex items-center justify-between gap-4 mt-3 px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 hover:border-gslt-400 hover:bg-gslt-50 transition-all group/file">
          <div class="flex items-center gap-3 min-w-0">
            <span class="shrink-0 px-2 py-1 rounded-md bg-slate-900 text-white text-[10px] font-black tracking-wider">${escapeHtml(fileExt(f.name))}</span>
            <span class="text-sm font-semibold text-slate-700 truncate">${escapeHtml(f.name)}</span>
            <span class="shrink-0 text-xs text-slate-400">${fileSize(f.size)}</span>
          </div>
          <span class="shrink-0 text-sm font-bold text-gslt-600 group-hover/file:underline">다운로드</span>
        </a>`).join('');
      return `
      <div class="bg-white rounded-2xl border border-slate-200/70 shadow-sm p-6 md:p-7">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h3 class="font-bold text-lg break-keep mb-1">${escapeHtml(p.title)}</h3>
            <p class="text-sm text-slate-500 break-keep">${escapeHtml(p.excerpt)}</p>
          </div>
          <p class="shrink-0 text-xs font-semibold text-slate-400 pt-1">${formatDate(p.createdAt)}</p>
        </div>
        ${fileRows || '<p class="mt-3 text-sm text-slate-400">첨부된 파일이 없습니다.</p>'}
      </div>`;
    }

    (async () => {
      let posts = [];
      let failed = false;
      try {
        posts = await fetchPosts('downloads');
      } catch (e) {
        posts = [];
        failed = true;
      }
      if (!posts.length) {
        if (failed) empty.innerHTML = '<p class="text-lg font-semibold mb-1">목록을 불러오지 못했습니다</p><p class="text-sm">일시적인 문제일 수 있습니다. 잠시 후 새로고침해 주세요.</p>';
        empty.classList.remove('hidden');
        return;
      }
      list.innerHTML = posts.map(row).join('');
    })();
  </script>
</body>

</html>
